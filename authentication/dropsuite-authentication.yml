notes: >-
  Dropsuite (now NinjaOne SaaS Backup) exposes a partner REST API whose credentials
  are provisioned per-partner from the Partner Portal under Settings -> API Settings.
  API access is gated to Direct Partners / Distributors. No public OpenAPI or open
  self-service credentials are published; the API URL is partner-specific. Auth is
  token-based using two tokens issued in the portal (Reseller Token + Authentication
  Token) alongside the partner API URL. Exact header/parameter names are documented
  inside the partner-gated help center and are not reproduced here (no fabrication).
