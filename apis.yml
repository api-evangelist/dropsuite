name: Dropsuite
description: >-
  Dropsuite, now a NinjaOne company, is a cloud backup, archiving, and recovery
  platform built for managed service providers (MSPs) and their small-to-midsize
  business customers. It provides automated backup and one-click restore for
  Microsoft 365, Microsoft Entra ID, Google Workspace, email, and website/database
  data, plus long-term email archiving with legal hold, eDiscovery, and journaling
  for compliance. Partners manage tenants through a multi-tenant portal and can
  automate provisioning, reporting, and reconciliation through a partner REST API
  gated to Direct Partners and Distributors (credentials issued in the Partner
  Portal under Settings -> API Settings). Dropsuite was surfaced as a portfolio
  company of 500 Global and profiled in the API Evangelist network.
